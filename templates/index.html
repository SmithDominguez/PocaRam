<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de Celebridades</title>
</head>
<body>
    <h1>Detector de Celebridades</h1>
    <form action="/detectar" method="POST" enctype="multipart/form-data">
        <label for="file">Sube una imagen para detectar celebridades:</label>
        <input type="file" name="file" id="file" accept="image/*" required>
        <button type="submit">Detectar en Imagen</button>
    </form>
</body>
</html>
